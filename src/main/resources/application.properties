# --- APPLICATION NAME ---
spring.application.name=MaliyyeApp

# --- DATABASE CONFIGURATION ---
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-wild-field-b57cg85i-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_gloDd6cbrq7p}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE CONFIGURATION ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- BATCH & PERFORMANCE OPTIMIZATION ---
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.open-in-view=false

# --- HIKARI CONNECTION POOL (NEON OPTIMIZED) ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# --- SERVER PORT ---
server.port=${PORT:8080}

# --- TOMCAT CONFIGURATION ---
server.tomcat.max-threads=100
server.tomcat.min-spare-threads=5

# --- THYMELEAF CACHE (FOR SPEED) ---
spring.thymeleaf.cache=true