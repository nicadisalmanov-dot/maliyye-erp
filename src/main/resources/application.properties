# --- T?TB?Q ADI ---
spring.application.name=MaliyyeApp

# --- VER?L?NL?R BAZASI (H?m Lokal Docker, H?m Bulud/Neon üçün) ---
# ?g?r DB_URL varsa (Google Cloud-da), Neon-a qo?ulur.
# ?g?r DB_URL yoxdursa (lokalda), Docker-d?ki bazaya qo?ulur.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / H?BERNATE AYARLARI ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- SÜR?T OPT?MALLA?DIRMASI ---
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- H?KAR? (BA?LANTI HOVUZU) AYARLARI ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- SERVER PORTU ---
# Google Cloud-da PORT mühit d?yi??ni avtomatik t?yin olunur.
# Lokalda is? 8080 istifad? olunur.
server.port=${PORT:8080}

# --- TOMCAT OPT?MALLA?DIRMASI ---
server.tomcat.max-threads=100
server.tomcat.min-spare-threads=5