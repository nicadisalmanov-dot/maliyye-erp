# --- T?TB?Q ADI ---
spring.application.name=MaliyyeApp

# --- VER?L?NL?R BAZASI (H?m Lokal Docker, H?m Bulud/Neon üçün) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE AYARLARI ---
# Render-d? c?dv?ll?rin avtomatik yaranmas?/yenil?nm?si üçün 'update' olmal?d?r
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- SÜR?T OPT?MALLA?DIRMASI ---
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- H?KAR? (BA?LANTI HOVUZU) AYARLARI ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- SERVER PORTU ---
# Render-d? PORT mühit d?yi??ni avtomatik t?yin olunur. ?g?r yoxdursa, 8080 i?l?yir.
server.port=${PORT:8080}

# --- TOMCAT OPT?MALLA?DIRMASI ---
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
spring.thymeleaf.cache=false
