spring.application.name=MaliyyeApp

# --- VER?L?NL?R BAZASI KONF?QURAS?YASI ---
# Render-d? DB_URL, DB_USER, DB_PASSWORD d?yi??nl?ri varsa, onlar? istifad? edir.
# ?g?r yoxdursa (lokalda), o zaman default olaraq Neon bazas?na qo?ulur.
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-wild-field-b57cg85i-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_gloDd6cbrq7p}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ayarlar? ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- SÜR?T OPT?MALLA?DIRMASI ---
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- Server Portu ---
server.port=8080

# --- Tomcat optimalla?d?rmas? ---
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10