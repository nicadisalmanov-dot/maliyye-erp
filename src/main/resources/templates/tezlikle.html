<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Tezliklə - ERP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #e9ecef; color: #333; display: flex; min-height: 100vh; }
        .sidebar { width: 220px; background: #0f4c81; color: white; padding: 20px 0; position: fixed; height: 100vh; }
        .sidebar h2 { padding: 0 20px 20px 20px; font-size: 18px; border-bottom: 1px solid #1976d2; margin-bottom: 15px; }
        .sidebar a { display: block; padding: 12px 20px; color: #bbdefb; text-decoration: none; font-size: 14px; }
        .sidebar a.aktiv { background: #1976d2; color: white; border-left: 4px solid #64b5f6; font-weight: bold; }
        .esas { margin-left: 220px; flex: 1; padding: 30px; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        h1 { color: #0f4c81; margin-bottom: 20px; }
        p { color: #666; font-size: 18px; margin-bottom: 30px; text-align: center; }
        a.geri { padding: 10px 20px; background: #1976d2; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
<div class="sidebar">
    <h2>💰 Maliyyə ERP</h2>
    <a href="/">🏠 Dashboard</a>
    <a href="/kassa">💵 Kassa</a>
    <a href="/bank">🏦 Bank</a>
    <a href="/kontragentler">👥 Kontragentlər</a>
    <a href="/hesabat">📊 Hesabat</a>
    <a href="/anbar" >📦 Anbar Əməliyyatları</a>
    <a href="/satis">💼 Satış</a>
    <a href="/satinalma">🛒 Satınalma</a>
    <a href="/istifadeciler">👥 İstifadəçilər</a>
</div>

<div class="esas">
    <!-- İstifadəçi Paneli (Sağ Yuxarı) -->
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 15px; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #ddd;">
            <span style="font-weight: bold; color: #0f4c81;">
                👤 <span sec:authentication="name">İstifadəçi</span>
            </span>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" style="background: #c62828; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">
                Çıxış
            </button>
        </form>
    </div>
    <h1>🚧 Səhifə Hazırlanır</h1>
    <p>Bu bölmə ("<span th:text="${sehifeAdi}"></span>") hazırda inkişaf mərhələsindədir.<br>Tezliklə istifadəyə veriləcək!</p>
    <a href="/anbar" class="geri">← Anbar Menyusuna Qayıt</a>
</div>
</body>
</html>
