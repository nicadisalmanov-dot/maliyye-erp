<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Sistemə Giriş - ERP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f4c81; display: flex; justify-content: center; align-items: center; height: 100vh; }

        .login-kart { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #0f4c81; margin-bottom: 30px; font-size: 24px; }

        .input-qrup { margin-bottom: 20px; text-align: left; }
        .input-qrup label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 14px; }
        .input-qrup input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; }
        .input-qrup input:focus { outline: none; border-color: #1976d2; }

        button { width: 100%; padding: 14px; background: #1976d2; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #1565c0; }

        .xeta { color: #c62828; background: #ffebee; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 14px; }
        .ugur { color: #2e7d32; background: #e8f5e9; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-kart">
    <h1>💰 Maliyyə ERP</h1>

    <!-- Xəta mesajları -->
    <div class="xeta" th:if="${param.error}">
        İstifadəçi adı və ya şifrə yanlışdır!
    </div>
    <div class="ugur" th:if="${param.logout}">
        Sistemdən uğurla çıxış etdiniz.
    </div>

    <!-- Giriş Forması -->
    <form th:action="@{/login}" method="post">
        <div class="input-qrup">
            <label>İstifadəçi adı</label>
            <input type="text" name="username" placeholder="İstifadəçi adınızı daxil edin" required autofocus>
        </div>
        <div class="input-qrup">
            <label>Şifrə</label>
            <input type="password" name="password" placeholder="Şifrənizi daxil edin" required>
        </div>
        <button type="submit">Daxil ol</button>
    </form>
</div>

</body>
</html>
