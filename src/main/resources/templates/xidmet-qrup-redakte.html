<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Qrup Redaktə</title></head>
<body style="font-family: Arial; padding: 50px; text-align: center;">
<h2>Xidmət Qrupunu Redaktə Et</h2>
<form th:action="@{/anbar/xidmetler/qrup-redakte/{id}(id=${qrup.id})}" method="post">
    <input type="text" name="ad" th:value="${qrup.ad}" required style="padding: 10px; width: 300px; margin-bottom: 10px;"><br>
    <button type="submit" style="padding: 10px 20px; background: #1976d2; color: white; border: none; border-radius: 5px; cursor: pointer;">Yadda Saxla</button>
    <a href="/anbar/xidmetler" style="margin-left: 10px; text-decoration: none; color: #666;">Ləğv et</a>
</form>
</body>
</html>
