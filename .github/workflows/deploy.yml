name: Deploy to GCP VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Prepare SSH Key
      run: |
        echo "${{ secrets.VM_SSH_KEY }}" > id_rsa
        chmod 600 id_rsa

    - name: Copy JAR to VM using SCP
      run: |
        scp -o StrictHostKeyChecking=no -i id_rsa target/*.jar ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/

    - name: Restart Application via SSH
      run: |
        ssh -o StrictHostKeyChecking=no -i id_rsa ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
          sudo pkill -9 -f MaliyyeApp || true
          sleep 3
          nohup java -jar /home/${{ secrets.VM_USER }}/*.jar > /tmp/app.log 2>&1 &
          sleep 5
          tail -n 20 /tmp/app.log
        EOF