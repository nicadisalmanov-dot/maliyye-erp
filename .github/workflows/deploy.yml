name: Deploy to GCP VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Set up SSH Agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.VM_SSH_KEY }}

    - name: Copy JAR to VM using SCP
      run: |
        scp -o StrictHostKeyChecking=no target/*.jar ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/

    - name: Restart Application via SSH
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
          sudo pkill -9 -f MaliyyeApp || true
          sleep 3
          nohup java -jar /home/${{ secrets.VM_USER }}/target/*.jar > /tmp/app.log 2>&1 &
          sleep 5
          tail -n 20 /tmp/app.log
        EOF